services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://officeflow:officeflow@postgres:5432/officeflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      AUTH_REQUIRED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - officeflow-storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.queue:celery_app worker --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://officeflow:officeflow@postgres:5432/officeflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      AUTH_REQUIRED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - officeflow-storage:/app/backend/storage
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: officeflow
      POSTGRES_USER: officeflow
      POSTGRES_PASSWORD: officeflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U officeflow -d officeflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  officeflow-storage:
  postgres-data:
  redis-data:
